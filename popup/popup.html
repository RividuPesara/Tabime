<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anime Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Anime Tracker</h1>
      <div id="account-area" class="account-area"></div>
    </header>

    <section id="login-section" class="login-section" hidden>
      <p class="section-label">Log in to save anime to your list.</p>
      <button class="save-btn" data-provider="anilist">Log in with AniList</button>
      <button class="save-btn" data-provider="mal">Log in with MyAnimeList</button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </section>

    <div id="app" hidden>
      <section id="match-section" class="match-section" hidden>
        <p class="section-label">Current tab</p>
        <div id="match-card" class="match-card"></div>
      </section>

      <section id="match-status" class="match-status"></section>

      <section class="list-section">
        <div class="list-header">
          <p id="list-label" class="section-label">Your list (Watching)</p>
          <span id="list-count" class="list-count"></span>
        </div>
        <input
          id="filter-input"
          class="filter-input"
          type="search"
          placeholder="Filter titles…"
          autocomplete="off"
        />
        <ul id="anime-list" class="anime-list"></ul>
        <p id="empty-state" class="empty-state" hidden>Nothing saved yet.</p>
      </section>

      <div id="toast" class="toast" role="status" hidden></div>
    </div>

    <script src="../lib/config.js"></script>
    <script src="../lib/title-parser.js"></script>
    <script src="../lib/anilist.js"></script>
    <script src="../lib/mal.js"></script>
    <script src="../lib/auth.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
